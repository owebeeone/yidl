name: Documentation build
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'example/documentation/**'
      - 'dev-docs/documentation/**'
      - 'tests/**'
      - 'src/**'
      - 'mkdocs.yml'
      - 'docs-requirements.txt'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.12'
      - name: Install isolated documentation and example environments
        run: |
          python -m venv build/docs-env
          build/docs-env/bin/python -m pip install -r docs-requirements.txt
          python -m venv build/example-env
          build/example-env/bin/python -m pip install build
          build/example-env/bin/python -m build --wheel --outdir build/wheels
          build/example-env/bin/python -m pip install build/wheels/yidl-0.1.0-py3-none-any.whl 'astichi==1.1.3' pytest black==26.3.1
      - name: Execute installed public examples and canonical tutorial outputs
        env:
          ASTICHI_LOWER_ENGINE: python
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          build/example-env/bin/python dev-docs/documentation/verify_examples.py
          build/example-env/bin/python -m pytest tests/test_yidl_goldens.py -q -k 'documentation_classes or fixture_sets'
      - name: Build and validate active site
        run: |
          build/docs-env/bin/python -m mkdocs build --strict
          build/docs-env/bin/python dev-docs/documentation/check_site.py build/docs-site
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yidl-documentation-preview
          path: |
            build/docs-site
            build/documentation-evidence.json
