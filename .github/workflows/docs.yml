name: Documentation build and release publication
on:
  release:
    types: [published]
  pull_request:
    paths:
      - 'docs/**'
      - 'example/documentation/**'
      - 'dev-docs/documentation/**'
      - 'tests/**'
      - 'src/**'
      - 'mkdocs.yml'
      - 'docs-requirements.txt'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: yidl-docs-${{ github.event_name == 'release' && 'production' || github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Require release version agreement
        run: |
          python - <<'PYCODE'
          import os
          from pathlib import Path
          import tomllib

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["RELEASE_TAG"]
          if tag and tag != f"v{version}":
              raise SystemExit("Release tag does not match the documentation candidate")
          PYCODE
          python scripts/release_version.py verify "$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
      - name: Install isolated documentation and example environments
        run: |
          python -m venv build/docs-env
          build/docs-env/bin/python -m pip install -r docs-requirements.txt
          python -m venv build/example-env
          build/example-env/bin/python -m pip install build==1.6.1
          build/example-env/bin/python -m build --wheel --outdir build/wheels
          build/example-env/bin/python -m pip install build/wheels/*.whl pytest==8.4.2 black==26.3.1
      - name: Execute installed public examples and canonical tutorial outputs
        env:
          ASTICHI_LOWER_ENGINE: python
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          build/example-env/bin/python dev-docs/documentation/verify_examples.py
          build/example-env/bin/python -m pytest tests/test_yidl_goldens.py -q -k 'documentation_classes or fixture_sets'
      - name: Build and validate active site
        run: |
          build/docs-env/bin/python -m mkdocs build --strict
          build/docs-env/bin/python dev-docs/documentation/check_site.py build/docs-site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: yidl-documentation-preview
          path: |
            build/docs-site
            build/documentation-evidence.json
      - name: Package the release site for GitHub Pages
        if: github.event_name == 'release' && github.repository == 'owebeeone/yidl'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/docs-site

  deploy:
    name: Publish released documentation
    if: github.event_name == 'release' && github.repository == 'owebeeone/yidl'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy the verified release site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
