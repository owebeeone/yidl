name: Publish YIDL to PyPI

on:
  release:
    types: [published]
  # Manual runs verify the candidate but never upload to PyPI.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yidl-pypi
  cancel-in-progress: false

jobs:
  verify:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      ASTICHI_LOWER_ENGINE: python
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Require package and release version agreement
        run: |
          python - <<'PY'
          import ast
          import os
          from pathlib import Path
          import tomllib

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          if project["name"] != "yidl":
              raise SystemExit("Expected the yidl distribution")
          version = project["version"]
          tag = os.environ["RELEASE_TAG"]
          if tag and tag != f"v{version}":
              raise SystemExit(f"Release tag {tag!r} does not match v{version}")
          module = ast.parse(Path("src/yidl/__init__.py").read_text())
          versions = [
              ast.literal_eval(node.value)
              for node in module.body
              if isinstance(node, ast.Assign)
              and any(isinstance(t, ast.Name) and t.id == "__version__" for t in node.targets)
          ]
          if versions != [version]:
              raise SystemExit("Package metadata and yidl.__version__ disagree")
          print(f"Verifying yidl {version}")
          PY

      - name: Build wheel and source distribution
        run: |
          python -m pip install build==1.6.1 twine==7.0.0
          python -m build
          python -m twine check --strict dist/*

      - name: Verify a fresh wheel installation outside the checkout
        run: |
          distribution="$(realpath dist/*.whl)"
          python -m venv "$RUNNER_TEMP/yidl-wheel"
          "$RUNNER_TEMP/yidl-wheel/bin/python" -m pip install "$distribution"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/yidl-wheel/bin/python" -I -c \
            'from yidl.concept_parser import compile_yidl_files; from yidl.generation.data_def_sys import emit_concept_runtime_source'
          "$RUNNER_TEMP/yidl-wheel/bin/python" -I \
            "$GITHUB_WORKSPACE/example/documentation/generate.py" --out "$RUNNER_TEMP/wheel-example"

      - name: Verify a fresh source-distribution installation outside the checkout
        run: |
          distribution="$(realpath dist/*.tar.gz)"
          python -m venv "$RUNNER_TEMP/yidl-sdist"
          "$RUNNER_TEMP/yidl-sdist/bin/python" -m pip install "$distribution"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/yidl-sdist/bin/python" -I -c \
            'from yidl.concept_parser import compile_yidl_files; from yidl.generation.data_def_sys import emit_concept_runtime_source'
          "$RUNNER_TEMP/yidl-sdist/bin/python" -I \
            "$GITHUB_WORKSPACE/example/documentation/generate.py" --out "$RUNNER_TEMP/sdist-example"

      - name: Retain the verified distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: yidl-distributions
          path: dist/*
          if-no-files-found: error

  test:
    name: Source tests (Python ${{ matrix.python }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      ASTICHI_LOWER_ENGINE: python
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: yidl-distributions
          path: dist
      - name: Install the candidate and test tools
        run: python -m pip install dist/*.whl pytest==8.4.2 black==26.3.1
      - name: Run repository regression tests
        run: python -m pytest -q -p no:cacheprovider --ignore=tests/test_yidl_lifecycle_external_smoke.py

  publish:
    name: Publish verified distributions to PyPI
    if: github.event_name == 'release' && github.repository == 'owebeeone/yidl'
    needs: [verify, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    # No environment is required by the configured publisher (Environment: Any).
    # GEARU remains the selected tool for preparing tags and GitHub releases.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: yidl-distributions
          path: dist

      - name: Publish using PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
