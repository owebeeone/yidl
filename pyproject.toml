[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "yidl"
version = "0.1.1"
description = "Declarative Python code-generation compiler"
readme = "README.md"
license = "LGPL-2.1-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["lark>=1.1", "astichi==1.1.3"]
authors = [{ name = "YIDL contributors" }]
keywords = ["dsl", "compiler", "codegen", "lifecycle"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.scripts]
yidl-compile = "yidl.cli:main"

[project.urls]
Source = "https://github.com/owebeeone/yidl"
Issues = "https://github.com/owebeeone/yidl/issues"
Documentation = "https://owebeeone.github.io/yidl/"

[project.optional-dependencies]
dev = ["black==26.3.1", "pytest>=7.0"]

[tool.uv]
exclude-newer = "1 week"

[tool.hatch.build]
sources = ["src"]

[tool.hatch.build.targets.sdist]
include = ["src/yidl", "docs", "example", "tests", "dev-docs", "spec", "scripts", "RELEASE.md", "gearu.toml", ".release.env", "mkdocs.yml", "docs-requirements.txt"]

# Run: python -m pytest
# If another installed package registers a broken pytest plugin, use:
#   PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest
[tool.pytest.ini_options]
# ``.`` keeps ``tests`` importable; ``docs/validation`` exposes the ``study`` package.
pythonpath = [".", "src", "docs/validation"]
testpaths = ["tests", "docs/validation/study"]

[tool.yidl.test-matrix]
python = ["3.12", "3.13", "3.14"]
